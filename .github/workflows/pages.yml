name: Deploy backlog board to Pages

on:
  push:
    branches: [main]
    paths:
      - backlog/**
      - scripts/build_board_site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install -g backlog.md

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - run: bash scripts/build_board_site.sh

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
