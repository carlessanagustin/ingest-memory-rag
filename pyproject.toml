[project]
name = "ingest-memory-rag"
version = "0.1.0"
description = "Watch a folder and ingest .txt/.md files into a Qdrant vector DB via Haystack."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "haystack-ai>=2.6",
    "qdrant-haystack>=5.0",
    "watchdog>=4.0",
    "sentence-transformers>=3.0",
    "markdown-it-py>=3.0",
    "mdit-plain>=1.0",
    "sentence-transformers-haystack>=0.1.1",
]

[project.scripts]
ingest-memory-rag = "ingest_memory_rag.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_memory_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 3.12 so mypy can parse dependency stubs (e.g. numpy) that use `type` aliases;
# runtime support still includes 3.11 (see requires-python and the CI matrix).
python_version = "3.12"
files = ["src"]
mypy_path = "src"
disallow_untyped_defs = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=ingest_memory_rag --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: exercises a live Qdrant at QDRANT_URL (needs the Haystack ML stack)",
]

[tool.coverage.run]
source = ["ingest_memory_rag"]
# The Haystack/Qdrant layer needs heavy deps and a live vector DB; it is
# exercised by integration runs, not by the fast, network-free unit suite.
omit = [
    "src/ingest_memory_rag/pipeline.py",
    "src/ingest_memory_rag/ingest.py",
    "src/ingest_memory_rag/__main__.py",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
