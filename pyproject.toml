[project]
name = "ingest-memory-rag"
version = "0.1.0"
description = "Watch a folder and ingest .txt/.md files into a Qdrant vector DB (Haystack parsing, fastembed embeddings)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "haystack-ai>=2.6",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "watchdog>=4.0",
    "markdown-it-py>=3.0",
    "mdit-plain>=1.0",
    "pathspec>=1.1.1",
]

[project.scripts]
ingest-memory-rag = "ingest_memory_rag.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_memory_rag"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Matches requires-python (3.14).
python_version = "3.14"
files = ["src"]
mypy_path = "src"
disallow_untyped_defs = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=ingest_memory_rag --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: exercises a live Qdrant at QDRANT_URL (needs the Haystack ML stack)",
]

[tool.coverage.run]
source = ["ingest_memory_rag"]
# The Haystack/Qdrant layer needs heavy deps and a live vector DB; it is
# exercised by integration runs, not by the fast, network-free unit suite.
omit = [
    "src/ingest_memory_rag/pipeline.py",
    "src/ingest_memory_rag/ingest.py",
    "src/ingest_memory_rag/__main__.py",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
