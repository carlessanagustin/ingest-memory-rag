services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333" # REST + web UI (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships bash but no curl/wget; a /dev/tcp probe confirms the
      # REST port is accepting connections (i.e. Qdrant is up).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    deploy:
      resources: # tunable
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  app:
    build: .
    container_name: ingest-memory-rag
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      WATCH_FOLDER: /app/raw
      # Bind-mounted host dirs do not deliver native inotify/FSEvents on
      # Docker Desktop; poll instead so host changes are detected.
      WATCH_USE_POLLING: "true"
    volumes:
      - ./raw:/app/raw
    healthcheck:
      # No HTTP server of its own; readiness = can it reach its hard
      # dependency (Qdrant) at the configured URL. urlopen raises on failure
      # -> non-zero exit -> unhealthy.
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(os.environ['QDRANT_URL'].rstrip('/')+'/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources: # tunable; runs fastembed on the startup scan
        limits:
          cpus: "2"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 512M

  mcp-qdrant:
    # Bridge that lets MCP clients (e.g. LobeChat) semantically search the
    # ingested collection. LobeChat has no native Qdrant support, but its
    # plugin system speaks MCP over Streamable HTTP, so we expose
    # mcp-server-qdrant on that transport (endpoint path /mcp).
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: mcp-qdrant
    command: ["uvx", "mcp-server-qdrant@0.8.1", "--transport", "streamable-http"]
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: Document
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      # FastMCP 2.x reads the SSE bind address from FASTMCP_SERVER_* (plain
      # FASTMCP_HOST is ignored); 0.0.0.0 makes it reachable across the network.
      FASTMCP_SERVER_HOST: 0.0.0.0
      FASTMCP_SERVER_PORT: "8000"
    ports:
      - "8000:8000" # Streamable HTTP endpoint (http://localhost:8000/mcp)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources: # tunable; runs fastembed for queries
        limits:
          cpus: "2"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434" # API (http://localhost:11434, http://ollama:11434 in-network)
    volumes:
      - ./ollama_storage:/root/.ollama
    healthcheck:
      # `ollama list` only succeeds once the API server is actually serving.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources: # tunable; must fit qwen3.6:27b - the Docker Desktop VM must actually be allocated this much RAM
        limits:
          cpus: "6" # capped from 8: Docker Desktop VM only has 6 CPUs allocated
          memory: 24G
        reservations:
          cpus: "1"
          memory: 2G
    # Docker Desktop (macOS/Windows) has no GPU passthrough, so this runs
    # CPU-only. On a Linux host with an NVIDIA GPU + nvidia-container-toolkit,
    # uncomment the block below to enable GPU acceleration:
    #   reservations:
    #     devices:
    #       - driver: nvidia
    #         count: all
    #         capabilities: [gpu]

  ollama-pull:
    # One-shot puller: targets the ollama service over the network so the
    # model lands in its persisted ./ollama_storage volume, not a separate
    # embedded server inside this container. Re-running is a no-op once the
    # model is already present.
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen3.6:27b"]
    restart: "no"

  lobe-chat:
    image: lobehub/lobe-chat:1.143.3
    container_name: lobe-chat
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "3210:3210"
    healthcheck:
      test:
        [
          "CMD",
          "/bin/node",
          "-e",
          "require('http').get('http://localhost:3210/health', (r) =>
            process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    environment:
      # No provider is baked in — set keys here (via .env) or in the LobeChat UI.
      # Empty defaults keep compose quiet when a var is unset; no secrets in git.
      ACCESS_CODE: ${LOBE_ACCESS_CODE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PROXY_URL: ${OPENAI_PROXY_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Local Ollama provider (served by the ollama/ollama-pull services below).
      ENABLED_OLLAMA: "1"
      OLLAMA_PROXY_URL: http://ollama:11434
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
        reservations:
          cpus: "0.25"
          memory: 512M
