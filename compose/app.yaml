services:
  app:
    build: .
    container_name: ingest-memory-rag
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      WATCH_FOLDER: /app/raw
      WATCH_USE_POLLING: "${WATCH_USE_POLLING:-true}"
      WATCH_REMOVE: "${WATCH_REMOVE:-false}"
    volumes:
      - ./raw:/app/raw
      - ./.watchignore:/app/raw/.watchignore:ro
    healthcheck:
      # No HTTP server of its own; readiness = can it reach its hard
      # dependency (Qdrant) at the configured URL. urlopen raises on failure
      # -> non-zero exit -> unhealthy.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen(os.environ['QDRANT_URL'].rstrip('/')+'/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources: # sized per environment — see environments/*.env (DEPLOY_ENV)
        limits:
          cpus: "${APP_CPU_LIMIT:-2}"
          memory: ${APP_MEM_LIMIT:-1.5G}
        reservations:
          cpus: "${APP_CPU_RES:-0.5}"
          memory: ${APP_MEM_RES:-512M}
