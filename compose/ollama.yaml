services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434" # API (http://localhost:11434, http://ollama:11434 in-network)
    volumes:
      - ./storage/ollama:/root/.ollama
    healthcheck:
      # `ollama list` only succeeds once the API server is actually serving.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources: # sized per environment — see environments/*.env (DEPLOY_ENV)
        limits:
          cpus: "${OLLAMA_CPU_LIMIT:-6}"
          memory: ${OLLAMA_MEM_LIMIT:-24G}
        reservations:
          cpus: "${OLLAMA_CPU_RES:-1}"
          memory: ${OLLAMA_MEM_RES:-2G}
          # Docker Desktop (macOS/Windows) has no GPU passthrough, so this runs
          # CPU-only. On a Linux host with an NVIDIA GPU + nvidia-container-toolkit,
          # add a devices reservation here to enable GPU acceleration:
          #   devices:
          #     - driver: nvidia
          #       count: all
          #       capabilities: [gpu]

  ollama-pull:
    # One-shot puller: pulls every model listed under provider.ollama.models
    # in compose/opencode/opencode.json, targeting the ollama service over the
    # network so models land in its persisted ./storage/ollama volume, not a
    # separate embedded server inside this container. Re-running is a no-op
    # once a model is already present.
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OPENCODE_CONFIG: /config/opencode.json
    entrypoint: ["/bin/bash"]
    command: ["/scripts/pull_models.sh"]
    volumes:
      - ./compose/opencode/opencode.json:/config/opencode.json:ro
      - ./compose/pull_models.sh:/scripts/pull_models.sh:ro
    restart: "no"
