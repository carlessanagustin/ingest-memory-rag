services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Skips first-run admin signup for easier local verification.
      WEBUI_AUTH: "False"
    volumes:
      - ./storage/openwebui:/app/backend/data
    healthcheck:
      test: [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).status==200 else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources: # tunable
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  mcpo:
    # MCP-to-OpenAPI bridge: OpenWebUI has no native MCP client, but it can
    # consume any OpenAPI "tool server". mcpo fronts mcp-qdrant's Streamable
    # HTTP endpoint and re-exposes it as a REST/OpenAPI server OpenWebUI (or
    # curl) can call directly.
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    command: ["--config", "/config/mcpo.config.json"]
    depends_on:
      mcp-qdrant:
        condition: service_healthy
    volumes:
      - ./compose/mcpo.config.json:/config/mcpo.config.json:ro
    ports:
      - "8001:8000" # OpenAPI server (http://localhost:8001/qdrant/docs); mcp-qdrant already owns host port 8000
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources: # tunable
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
